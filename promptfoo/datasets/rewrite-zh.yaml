- description: Chinese academic rewrite should keep JSON shape and section-level scope
  promptId: rewrite-zh
  vars:
    action_type: academic-rewrite
    section_title: 研究背景
    current_text: 当前研究主要关注城市热环境问题，但是相关机制还没有说清楚，需要进一步说明研究意义。
    comment_context: 导师意见：背景写得太泛，需要说明研究问题和本文切入点。
  assert:
    - type: javascript
      value: |
        try {
          const parsed = JSON.parse(output);
          return Boolean(parsed.candidate_text && parsed.summary && Array.isArray(parsed.warnings));
        } catch (error) {
          return false;
        }
    - type: not-contains
      value: 整篇论文

